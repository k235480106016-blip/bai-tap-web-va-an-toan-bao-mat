version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: web_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./html:/usr/share/nginx/html
    restart: always

  nodered:
    image: nodered/node-red:latest
    container_name: web_nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    restart: always

  mariadb:
    image: mariadb:10.6
    container_name: web_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: k59_db
      MYSQL_USER: k59user
      MYSQL_PASSWORD: k59password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: web_phpmyadmin
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web_cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token YOUR_CLOUDFLARE_TUNNEL_TOKEN

volumes:
  nodered_data:
  mariadb_data:

